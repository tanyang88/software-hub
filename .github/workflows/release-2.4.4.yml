name: Release 2.4.4

on:
  push:
    paths:
      - '.release-2.4.4'

permissions:
  contents: write

jobs:
  bump-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release trigger
        id: gate
        run: |
          if [ -f .release-2.4.4 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply 2.4.4 changes
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # app.js：中英文「关于」版本号
          p = Path('app/static/app.js')
          s = p.read_text(encoding='utf-8')
          assert s.count('当前版本：2.4.3') == 1
          assert s.count('Current version: 2.4.3') == 1
          s = s.replace('当前版本：2.4.3', '当前版本：2.4.4')
          s = s.replace('Current version: 2.4.3', 'Current version: 2.4.4')
          assert '2.4.3' not in s
          p.write_text(s, encoding='utf-8')

          # index.html：缓存参数、关于版本、按钮结构与脚本
          p = Path('app/static/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/static/styles.css?v=2.4.3', '/static/styles.css?v=2.4.4')
          s = s.replace('/static/mobile.css?v=2.4.3', '/static/mobile.css?v=2.4.4')
          s = s.replace('/static/app.js?v=2.4.3', '/static/app.js?v=2.4.4')
          s = s.replace('当前版本：2.4.3', '当前版本：2.4.4')

          mobile_link = '<link rel="stylesheet" href="/static/mobile.css?v=2.4.4">'
          assert mobile_link in s
          scroll_link = '<link rel="stylesheet" href="/static/scroll-jump.css?v=2.4.4">'
          if scroll_link not in s:
              s = s.replace(mobile_link, mobile_link + '\n' + scroll_link, 1)

          if 'card-scroll-shell' not in s:
              old_open = '    <div class="card-scroll" id="cardScroll">'
              assert s.count(old_open) == 1
              new_open = '    <div class="card-scroll-shell">\n    <div class="card-scroll" id="cardScroll">'
              s = s.replace(old_open, new_open, 1)

              rail = '''    <div class="scroll-jump" id="scrollJump" role="group" aria-label="卡片区快速滚动" hidden>
                  <button type="button" class="scroll-jump-btn" id="scrollTopBtn" title="回到顶部" aria-label="回到顶部">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M6 15l6-6 6 6"></path>
                    </svg>
                  </button>
                  <button type="button" class="scroll-jump-btn" id="scrollBottomBtn" title="滑到底部" aria-label="滑到底部">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M6 9l6 6 6-6"></path>
                    </svg>
                  </button>
                </div>'''
              assert s.count('  </main>') == 1
              s = s.replace('  </main>', rail + '\n    </div>\n  </main>', 1)

          app_script = '<script src="/static/app.js?v=2.4.4"></script>'
          assert app_script in s
          scroll_script = '<script src="/static/scroll-jump.js?v=2.4.4"></script>'
          if scroll_script not in s:
              s = s.replace(app_script, app_script + '\n' + scroll_script, 1)
          p.write_text(s, encoding='utf-8')

          # README：版本记录
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          anchor = '## 版本更新说明\n\n### 2.4.3'
          assert anchor in s
          section = '''## 版本更新说明

          ### 2.4.4
          - **卡片滚动快捷按钮**：卡片区滚动条右侧新增向上的「回到顶部」和向下的「滑到底部」两个按钮，点击后平滑滚动到卡片区顶部或底部；没有可滚动内容时自动隐藏，到达两端时对应按钮自动置灰。
          - **版本号**：设置 → 关于显示「当前版本：2.4.4」。

          ### 2.4.3'''
          s = s.replace(anchor, section, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/app.js app/static/index.html README.md
          git commit -m "feat: 卡片区增加回到顶部/滑到底部按钮，版本升至 2.4.4"
          git push

      - name: Clean up release trigger
        if: steps.gate.outputs.run == 'true'
        run: |
          git rm -q .github/workflows/release-2.4.4.yml .release-2.4.4
          git commit -m "chore: 清理 2.4.4 发布触发文件"
          git push
